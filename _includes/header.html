<header class="site-header">
  <div class="site-header__inner container">
    <a class="site-header__brand" href="{{ '/' | relative_url }}">
      <img class="site-header__logo" src="{{ '/assets/images/satchel-logo.svg' | relative_url }}" alt="" width="80" height="80">
      <span class="site-header__text">
        <span class="site-header__title">{{ site.title }}</span>
        <span class="site-header__tagline">{{ site.tagline }}</span>
      </span>
    </a>
  </div>
</header>
